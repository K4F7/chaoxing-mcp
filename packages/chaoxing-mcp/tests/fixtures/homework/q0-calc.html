	function dataURLtoBlob(imgData,type) {
        var arr = imgData.split(',');
        var mime = arr[0].match(/:(.*?);/)[1];
        var bytes =atob(arr[1]);     
        var array = [];
        for (var i = 0; i < bytes.length; i++){
           array.push(bytes.charCodeAt(i));
        }
        var blob = new Blob([new Uint8Array(array)], {type:  mime});
		return blob;
    }

            },
            dataType: "json",
            success: function (result) {
                if (!result.status) {
                    openWindowHintNew(2, result.msg, null, 1000);
                    return;
                }
                var data = result.data || "";
                if (data == "") {
                    openWindowHintNew(2, "未获取识别数据,code-1", null, 1000);
                    return;
                }
                var latex = data.latex || "";
                if (latex == "") {
                    openWindowHintNew(2, "未获取识别数据,code-2", null, 1000);
                    return;
                }
                $(".formulaText").val(latex);
                renderSvg();
            },
            error: function () {
                openWindowHintNew(2, "公式识别失败", function () {
                    $('.identifyMask').hide();
                }, 1000);
            }
        });
    }

    function renderSvgLoad() {
        var latex = $(".formulaText").val();
        latex = unhtml(latex);
        var content = '<span class="latex-formula">' + latex + '</span>';
        $("#formulaDiv").html(content);
        sourceTex2SvgAction($('span.latex-formula'));
    }

    function unhtml(text) {
        if (!text || text.length == 0) {
            return text;
        }
        var html = text.replace(/[&<">']/g, function (a, b) {
            return {
                '<': '&lt;',
                '&': '&amp;',
                '"': '&quot;',
                '>': '&gt;',
                "'": '&#39;'
            }[a];
        });
        return html;
    }

    function renderSvg() {
        renderSvgLoad();
        $(".identifing").hide();
        $(".identifyBot").show();
        $(".identifyAfter").show();
    }

    var formulaLock = 0;
    $(".formulaText").on("compositionstart", function () {
        formulaLock = 1;
    });
    $(".formulaText").on("compositionend", function () {
        formulaLock = 0;
        renderSvgLoad();
    });
    $(".formulaText").on("input", function () {
        if (formulaLock == 0) {
            renderSvgLoad();
        }
    });

    function saveFormula() {
        if ($(".identifyCenter svg").length > 0) {
            loading();
            svg2Png();
        } else {
            openWindowHintNew(2, "没有检测到内容", null, 1000);
        }
    }

    function uploadFormula(data, type) {
        var formData = new FormData();
        formData.append("fileType", type);
        try {
            var fileName = new Date().getTime() + '.' + type;
            formData.append("filePart", imgDataBlob(data), fileName);
        } catch (err) {
            formData.append("filedata", data);
        }

        var currentTime = $("#currentTime").val();
        var uploadEnc = $("#uploadEnc").val();
        var uploadUid = $("#uploadUid").val();

        jQuery.ajax({
            type: "post",
            url: ServerHost.uploadDomain + "/edit/uploadBase64?uid=" + uploadUid + "&enc2=" + uploadEnc + "&t=" + currentTime,
            dataType: 'json',
            xhrFields: {withCredentials: true},
            contentType: false,
            processData: false,
            data: formData,
            success: function (data) {
                if (!data.status) {
                    openWindowHintNew(2, "公式生成失败", null, 1000);
                    return;
                }
                var latex = $(".formulaText").val();
                var img = '<p><img style="vertical-align:middle;" class="ans-latex-moudle" data=\'' + escape(Ext.encode(latex)) + '\' '
						+ 'src="' + data.url + '"/></p>';

                $(".identifyMask").hide();

                if (formulaIndex == -1) {
                    ueditor = editor.ueditor;
                } else if (typeof editors != "undefined") {
                    ueditor = editors[formulaIndex].ueditor;
                }
                ueditor.execCommand("insertHtml", img);
            },
            error: function () {
                openWindowHintNew(2, "公式生成失败", null, 1000);
            },
            complete: function () {
                loadingClose();
            }
        });
    }

    function svg2Png() {
        var svgsource = $(".identifyCenter svg")[0];
        var width = $(svgsource).attr('width');
        var height = $(svgsource).attr('height');
        width = parseFloat(width);
        height = parseFloat(height);
        // 将 ex 值转换为像素值
        var fontSize = parseFloat(getComputedStyle(document.documentElement).fontSize);
        width = width * fontSize * 0.7;
        height = height * fontSize * 0.7;
        var border = 3;
        var svgXml = svgsource.outerHTML;
        var image = new Image();
        image.src = "data:image/svg+xml;base64," + window.btoa(unescape(encodeURIComponent(svgXml)));
        image.onload = function () {
            var canvas = document.createElement("canvas");
            canvas.width = width + border;
            canvas.height = height + border;
            var context = canvas.getContext("2d");
            context.drawImage(image, border / 2, border / 2, width, height); //裁剪透明像素并加边儿
            var imgData = canvas.getContext("2d").getImageData(0, 0, width, height).data;
            var lOffset = canvas.width,
                    rOffset = 0,
                    tOffset = canvas.height,
                    bOffset = 0;
            for (var i = 0; i < canvas.width; i++) {
                for (var j = 0; j < canvas.height; j++) {
                    var pos = (i + canvas.width * j) * 4;
                    if (imgData[pos] > 0 || imgData[pos + 1] > 0 || imgData[pos + 2] || imgData[pos + 3] > 0) {
                        bOffset = Math.max(j, bOffset); // 找到有色彩的最底部的纵坐标
                        rOffset = Math.max(i, rOffset); // 找到有色彩的最右端
                        tOffset = Math.min(j, tOffset); // 找到有色彩的最上端
                        lOffset = Math.min(i, lOffset); // 找到有色彩的最左端
                    }
                }
            }
            lOffset++;
            rOffset++;
            tOffset++;
            bOffset++;
            var canvas2 = document.createElement("canvas");
            canvas2.height = bOffset - tOffset + 100;
            canvas2.height = bOffset - tOffset + 100;
            var context2 = canvas2.getContext("2d");
            var w = canvas2.width;
            var h = canvas2.height;
            var ow = 50;
            var oh = 50;
            var nw = canvas2.width;
            var nh = canvas2.height;
            context2.drawImage(canvas, lOffset, tOffset, w, h, ow, oh, nw, nh);
            var dataUrl = canvas.toDataURL("image/png");
            uploadFormula(dataUrl, 'png');
        };
    }

    function imgDataBlob(imgData) {
        var arr = imgData.split(',');
        var mime = arr[0].match(/:(.*?);/)[1];
        var bytes = atob(arr[1]);
        var array = [];
        for (var i = 0; i < bytes.length; i++) {
            array.push(bytes.charCodeAt(i));
        }
        var blob = new Blob([new Uint8Array(array)], {type: mime});
        return blob;
    }
</script>

	window.location.href = url;

//连线题处理
function getOneConnLineAnswer(obj) {
	var answerPair = [];
	$(obj).each(function () {
		var name = $(this).attr("data");
		var content = $(this).val();
		var obj = {};
		obj.name = name;
		obj.content = content;
		answerPair.push(obj);
	});

	answerPair.sort(function (a, b) {
		var name1 = a.name || "";
		var name2 = b.name || "";
		return Number(name1) - Number(name2);
	});

	return JSON.stringify(answerPair);
}

function setConnLineAnswer() {
	var questionId = $("#questionId").val();
	var answerLineSelect = $("input[name='answerLineSelect']");
	var answer = getOneConnLineAnswer(answerLineSelect);
	$("#answer" + questionId).val(answer);
}

function checkConnLineAnswered() {
	var answered = false;
	var questionId = $("#questionId").val();
	if ($("input[name='type" + questionId + "']").val() == "11") {
		var answerLineSelect = $("input[name='answerLineSelect']");
		var answer = JSON.parse(getOneConnLineAnswer(answerLineSelect));
		$(answer).each(function(index) {
			var obj = answer[index];
			if (obj.content != '') {
				answered = true;
				return false;
			}
		});
	}
	return answered;
}

function unhtml(input) {
	if ( !input || input.length == 0) {
		return input;
	}
	var newInput = input.replace(/[&<">']/g, function(a, b) {
		return {
			'<' : '&lt;',
			'&' : '&amp;',
			'"' : '&quot;',
			'>' : '&gt;',
			"'" : '&#39;'
		}[a];
	});
	return newInput;
}

function filter(content) {
	var status = true;
	if ( !content || content.length == 0) {
		return status;
	}
	var patt = /[\uD800-\uDBFF][\uDC00-\uDFFF]/g;
	if (patt.test(content)) {
		status = false;
	}
	return status;
}

$(setTimeout(function () {
    $(".focusSpan").attr("tabindex", 0);
    $(".focusSpan").focus();
}, 500))
function sortMultiAnswer(answer) {
	if ( !answer || answer.length == 0) {
		return answer;
	}
	var answerArray = answer.split('');
	var sortedAnswerArray = answerArray.sort();
	var sortedAnswer = sortedAnswerArray.join('');
	return sortedAnswer;
}
