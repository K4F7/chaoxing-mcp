<script>
function showWorkVerify() {
    workVerifyCode();
    $(".verify-mask").css("display", "block");
    $(".verify-box").css("display", "block");
}

function hideWorkVerify() {
    $(".verify-mask").css("display", "none");
    $(".verify-box").css("display", "none");
}

function submitCheckTimes() {
    var addTimes = $("#addTimes").val() || 0;
    var limitWorkSubmitTimes = $("#limitWorkSubmitTimes").val() || 100;
    if (parseInt(addTimes) > parseInt(limitWorkSubmitTimes)) {
        showWorkVerify();
    } else {
        if($("#phoneSubmit").val() == '1' && typeof WAY != 'undefined' && WAY.box && typeof WAY.box.show == 'function') {
            WAY.box.show({
                'divid': 'loadingTip'
            });
        }
        setTimeout("submitForm(false)", 500);
    }
}

function workVerifyCode() {
    $("#workVerifyImg").attr("src", _HOST_CP2_ + "/verifyCode/stuWork?" + new Date().getTime());
}

function verifyCode() {

    var courseId = $("#courseId").val() || 0;
    var classId = $("#classId").val() || 0;
    var cpi = $("#cpi").val() || 0;
    var workId = $("#workId").val() || 0;
    var answerId = $("#answerId").val() || 0;
    var inputCode = $("#inputCode").val() || "";

    $.ajax({
        type: "get",
        url: _HOST_CP2_ + "/work/verify/code",
        cache: false,
        dataType: "json",
        async: false,
        data: {
            "courseId": courseId,
            "classId": classId,
            "cpi": cpi,
            "workId": workId,
            "answerId": answerId,
            "inputCode": inputCode
        },
        success: function (data) {
            if (!data.status) {
                openWindowHintClient(2, data.msg, function(){
                    workVerifyCode();
                    $("#inputCode").val("");
                }, 1000);
            } else {
                var enc = data.enc;
                $("#workTimesEnc").val(enc);
                submitForm(false);
            }
        }
    });
}

        var versonControl ="";

        var offset = userAgent.indexOf("ChaoXingStudy_");

        if(userAgent.indexOf("_ios_phone") > -1){

        if(versionStr==undefined){
            return false;
        }
        versionStr = versionStr.replace(/_|\./g,"");
        return versionStr+'' >= versonControl;
    };

        		var url = location.origin + _CP_ + "/work/phone/doHomeWork?"
                	+ "courseId=" + courseId 
                	+ "&classId="+ classId 
					+ "&source="+ 0 
                	+ "&workId=" +workRelationId
                	+ "&workAnswerId=" +workRelationAnswerId
                	+ "&knowledgeid=" + knowledgeid
                	+ "&enc=" + enc
                	+ "&mooc=1"
                	+ "&index=" + index;
                
                if (vx == 1) {
            		url = url + "&vx=" + vx
				} else {
					url = url + "&keyboardDisplayRequiresUserAction=1" + phone_protocol_tail;
				}
                
				window.location.href = url;
    		});
	});
	
	function submitForm(tempSave,callback) {
		var _tempSave = $("#tempSave").val();
		if(_tempSave != tempSave){
			$("#tempSave").val(tempSave);
		}

		var courseId = $("#courseId").val();
		var classId = $("#classId").val();
		var workId = $("#workRelationId").val();
		var knowledgeId = $("#knowledgeid").val();
		var enc = $("#enc").val();
		var answerId = $("#workRelationAnswerId").val();

		var ajax_url = _HOST_CP2_ + "/work/phone/doNormalHomeWorkSubmit?tempSave=" + tempSave;
		var ajax_type = "post";
		var ajax_data = $("#form1").serialize();
		$.ajax({
			type : ajax_type,
			url : ajax_url,
			data : ajax_data,
			dataType : 'json',
			success : function(response) {
				if (tempSave == true) {
					if (!response.status) {
						if (vx == 1 || isChaoxingClient == "false") {
							openWindowHint(HINT_TYPE_TIME, "", "提交失败", null, 1000);
						} else {
							openWindowHintClient(2, "提交失败", null, 1000);
						}
						return false;
					}
					var dataId = response.answerId;
					callback && callback(dataId);
				} else {
					if (!response.status) {
						if (vx == 1 || isChaoxingClient == "false") {
							openWindowHint(HINT_TYPE_TIME, "", response.msg, null, 1000);
						} else {
							openWindowHintClient(2, response.msg, null, 1000);
						}
						return false;
					}

					if (response.stuStatus == 5) {
						var taskTips = I18N_WORK.backdohereV2;
						if($("#taskTipsNew").val() == '1'){
							taskTips = I18N_WORK.tasktips2;
						}
						workPop(taskTips, "确定", function () {
							var url = location.origin + _CP_ + "/work/phone/doHomeWork?" + "courseId=" + courseId + "&classId=" + classId + "&workId=" + workId
									+ "&workAnswerId=" + answerId + "&knowledgeid=" + knowledgeId + "&enc=" + enc + "&mooc=1&source=0&index=0&checkIntegrity=true";
							if (vx == 1 || isChaoxingClient == "false") {
								url = url + "&vx=" + vx;
								window.location.href = url;
							} else {
								url = url + "&keyboardDisplayRequiresUserAction=1" + phone_protocol_tail;
								processOpenUrl(url, "", 0);
							}
						}, function () {
							if (vx == 1 || isChaoxingClient == "false") {
								webBack();
								return;
							}
							jsBridge.postNotification("CLIENT_REFRESH_STATUS", {
								"status": 1
							});
							jsBridge.postNotification('CLIENT_EXIT_LEVEL', {
								message: ''
							});
						});
					} else {
						if (vx == 1 || isChaoxingClient == "false") {
							openWindowHint(HINT_TYPE_TIME, "", "提交成功", function () {
								webBack();
							}, 1000);
							return;
						}
						openWindowHintClient(2, "提交成功", function () {
							jsBridge.postNotification("CLIENT_REFRESH_STATUS", {
								"status": 1
							});
							jsBridge.postNotification('CLIENT_EXIT_LEVEL', {
								message: ''
							});
						}, 1000);
					}
				}
			}
		});
	}
	function processOpenUrl(url,title,loadType){
        jsBridge.postNotification('CLIENT_OPEN_URL', { "title":title, "loadType": loadType, "webUrl": url});
    }

	function backTo() {
		var index = 0;
		var courseId = $("#courseId").val();
		var classId = $("#classId").val();
		var workRelationId = $("#workRelationId").val();
		var knowledgeid = $("#knowledgeid").val();
		var enc = $("#enc").val();
		var workRelationAnswerId = $("#workRelationAnswerId").val();
		var specialUrl ="/work/phone/doHomeWork?" + "courseId=" + courseId + "&classId=" + classId + "&source=" + 0 + "&workId=" + workRelationId + "&workAnswerId=" + workRelationAnswerId +
				"&knowledgeid=" + knowledgeid + "&enc=" + enc + "&mooc=1" + "&index=" + index;
		if (vx == 1) {
			specialUrl = specialUrl + "&vx=" + vx;
		} else {
			specialUrl = location.origin + _CP_ + specialUrl + "&keyboardDisplayRequiresUserAction=1" + phone_protocol_tail;
		}
		window.location.href = specialUrl;
	}

	function webBack() {
		var url = location.origin + _CP_ + "/work/phone/task-work?taskrefId=55671703&courseId=266240948&classId=152370813&cpi=CPI_FIXTURE&vx=1";
		window.location.href = url;
	}
</script>
